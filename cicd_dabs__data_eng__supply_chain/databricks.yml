# Declarative Automation Bundle: cicd_dabs__data_eng__supply_chain
# Simulated Salesforce, Excel, ERP, logistics and manufacturing IoT sources
# -> Lakeflow Spark Declarative Pipeline (bronze / silver / gold) -> orchestration job.
bundle:
  name: cicd_dabs__data_eng__supply_chain

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the demo schema
    default: dev_demo
  schema:
    description: Schema for all demo tables and the landing volume
    default: supply_chain

targets:
  dev:
    # Personal / CI scratch deployment: resources are prefixed with [dev <user>],
    # the schema is prefixed with dev_<user>_, and schedules are paused.
    mode: development
    default: true
    workspace:
      host: https://dbc-3fb58c7d-ac94.cloud.databricks.com
    variables:
      catalog: dev_demo

  prod:
    # Deployed only from GitHub Actions with the prod service principal
    # (jasj-demo-sp-cicd-prd). For a service principal, workspace.current_user.userName
    # is its application ID, so the deploying SP owns, manages and runs everything.
    mode: production
    workspace:
      host: https://dbc-df52510d-0fb6.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_demo
    permissions:
      - service_principal_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - group_name: users
        level: CAN_VIEW
