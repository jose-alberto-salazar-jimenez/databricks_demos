# Backfills. Run on days WITHOUT the full daily_refresh run (free tier 10k/day).
#   mode=recent : forecast-API past 11 days + today for every cell (8,060 calls, one run)
#   mode=history: ERA5 reanalysis for a sample of cells; capped by max_calls, re-run to resume
# Optional daily schedule (backfill_pause_status) resumes history once a day during a backfill
# window. Runs after completion skip every batch (no API calls), so an extra run is harmless.
resources:
  jobs:
    backfill:
      name: weather_forecast_warning_comms_backfill
      description: Capped, resumable backfills tagged with data_source and request_mode.
      schedule:
        quartz_cron_expression: "0 0 11 * * ?" # 11:00 UTC-5 = 16:00 UTC, ~24h after the first manual run
        timezone_id: ${var.refresh_timezone}
        pause_status: ${var.backfill_pause_status}
      max_concurrent_runs: 1
      timeout_seconds: 14400
      parameters:
        - name: mode
          default: ${var.backfill_default_mode}
        - name: countries
          default: PER,ECU,COL,PAN,CRI
        - name: max_calls
          default: "9000"
        - name: run_date
          default: "" # recent: blank = today; pass the same date to resume
        - name: history_start
          default: "2024-11-01"
        - name: history_end
          default: "2026-10-31"
        - name: per_country
          default: "60"
      tasks:
        - task_key: backfill_sources
          notebook_task:
            notebook_path: ../src/ingestion/backfill_sources.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.bronze_schema}
              volume: ${resources.volumes.landing.name}
      tags:
        project: weather_forecast_warning_comms
        layer: ingestion
