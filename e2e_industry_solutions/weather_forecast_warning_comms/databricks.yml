# Declarative Automation Bundle: weather_forecast_warning_comms
# Public weather / ENSO / extreme-event data -> Lakeflow (bronze / silver / gold)
# -> risk flags + LLM advisories -> Lakebase -> Databricks App (+ Genie Agent).
# Catalog and medallion schemas are platform prerequisites (created once, outside the
# bundle); the bundle owns everything inside them.
bundle:
  name: weather_forecast_warning_comms

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the solution
    default: weather_forecast_warnings_comms
  bronze_schema:
    description: Raw ingested data and the landing volume
    default: bronze
  silver_schema:
    description: Cleaned, conformed, location-matched data
    default: silver
  gold_schema:
    description: Business-ready tables served to Lakebase, Genie and the app
    default: gold
  refresh_cron:
    description: Quartz cron for the daily refresh job (paused automatically in dev)
    default: "0 0 5 * * ?" # 05:00 daily
  refresh_pause_status:
    description: PAUSED or UNPAUSED (dev mode pauses schedules automatically)
    default: UNPAUSED
  refresh_timezone:
    description: Timezone for the daily refresh (UTC-5, no DST)
    default: America/Bogota
  llm_endpoint:
    description: Unity Catalog model service (system.ai) for advisories
    default: system.ai.qwen3-next-80b-a3b-instruct
  llm_fallback_endpoint:
    description: Fallback model service, used only for rows where the primary call fails
    default: system.ai.gpt-oss-20b

targets:
  dev:
    # Personal deployment: jobs/pipelines prefixed with [dev <user>], schedules paused.
    # dev and prod share one workspace but use separate catalogs, so tables, volumes and
    # pipelines never collide (development mode does not rename tables or volumes).
    mode: development
    default: true
    workspace:
      host: https://dbc-9ce31297-2bf5.cloud.databricks.com
    variables:
      catalog: weather_forecast_warnings_comms_dev

  prod:
    # Shared deployment. Today deployed by the owner; to be moved to a GitHub Actions
    # service principal (see CHANGELOG / ARCHITECTURE section 7).
    mode: production
    workspace:
      host: https://dbc-9ce31297-2bf5.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: weather_forecast_warnings_comms
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - group_name: users
        level: CAN_VIEW
