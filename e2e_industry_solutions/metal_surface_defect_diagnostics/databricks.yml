# Declarative Automation Bundle: metal_surface_defect_diagnostics
# Pipe corrosion image diagnostics (predictive + prescriptive) on the NEU surface defect dataset:
# UC Volume -> Auto Loader -> Delta -> CPU transfer learning (MLflow) -> UC model -> Model Serving
# -> Streamlit Databricks App grounded on an SME defect playbook + Foundation Model API.
# The catalog is a platform prerequisite (created once, outside the bundle); the bundle owns the
# schema and everything inside it.
bundle:
  name: metal_surface_defect_diagnostics

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the solution (prerequisite)
    default: poc_metal_surface_defect_diagnostics
  schema:
    description: Schema owned by the bundle (tables, volume, registered model)
    default: metal_surface_defects
  raw_volume:
    description: Managed volume holding the uploaded NEU zip and the extracted images
    default: raw
  model_name:
    description: Registered model name in Unity Catalog (catalog.schema prefix added at runtime)
    default: msd_defect_classifier
  serving_endpoint:
    description: Model Serving endpoint for the image classifier
    default: msd-defect-classifier
  llm_endpoint:
    description: Foundation Model API endpoint used for the grounded diagnostic report
    default: databricks-meta-llama-3-3-70b-instruct
  warehouse_id:
    description: SQL warehouse the app uses to read the playbook index (demo_serverles)
    default: b91f5b2fb518a0b7
  confidence_threshold:
    description: Below this top-1 confidence the result is routed to human review
    default: "0.70"
  min_test_accuracy:
    description: Promotion gate - a new model version becomes @champion only at or above this test accuracy
    default: "0.90"
  train_epochs:
    description: Training epochs for the CPU transfer-learning run
    default: "8"

targets:
  dev:
    # Personal deployment: jobs prefixed with [dev <user>], schedules paused.
    mode: development
    default: true
    variables:
      # Serving endpoint names are workspace-global and not prefixed by development mode.
      serving_endpoint: msd-defect-classifier-dev

  prod:
    # Shared deployment. Today deployed by the owner; to be moved to a CI/CD service principal.
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - group_name: users
        level: CAN_VIEW
