# Serve plane: Streamlit Databricks App (source in src/app/).
# The app runs as its own service principal. Each entry under `resources` grants that principal
# exactly one permission and exposes the resource to the app; app.yaml reads the values with
# `valueFrom: <resource name>`, so no endpoint, warehouse or table name is hard-coded in the app.
# For the TABLE securable, USE CATALOG / USE SCHEMA are granted automatically.
resources:
  apps:
    msd_app:
      name: ${var.app_name}
      description: >-
        Metal Surface Defect Diagnostics: upload a metal surface photo, classify the defect, and
        get a diagnostic report grounded on the SME defect playbook.
      source_code_path: ../src/app
      resources:
        - name: classifier-endpoint
          description: Image classifier (Model Serving, @champion version)
          serving_endpoint:
            name: ${var.serving_endpoint}
            permission: CAN_QUERY
        - name: llm-endpoint
          description: Foundation Model API endpoint for the grounded report
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY
        - name: sql-warehouse
          description: SQL warehouse used to read the playbook index
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: playbook-table
          description: Playbook index (defect_playbook Delta table)
          uc_securable:
            securable_full_name: ${var.catalog}.${resources.schemas.msd.name}.defect_playbook
            securable_type: TABLE
            permission: SELECT
        # Human-in-the-loop: feedback and expert reviews (table created by the job's playbook task).
        - name: feedback-table
          description: Feedback and expert reviews (diagnosis_feedback Delta table)
          uc_securable:
            securable_full_name: ${var.catalog}.${resources.schemas.msd.name}.diagnosis_feedback
            securable_type: TABLE
            permission: MODIFY
        - name: review-volume
          description: Raw volume; reviewed images are copied under reviews/ as labelled examples
          uc_securable:
            securable_full_name: ${var.catalog}.${resources.schemas.msd.name}.${resources.volumes.raw.name}
            securable_type: VOLUME
            permission: WRITE_VOLUME
