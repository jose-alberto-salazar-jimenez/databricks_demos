# ONE-TIME cleanup before renaming the bundle supply_chain_lakehouse -> cicd_dabs__data_eng__supply_chain.
#
# Destroys everything deployed by the OLD bundle in the chosen target (job, pipeline, schema
# `supply_chain` incl. all tables and the landing volume). It checks out the last commit that still
# has the old bundle (973438d), so it keeps working after the rename is merged.
#
# Run it manually: Actions -> "legacy supply_chain_lakehouse destroy (one-time)" -> Run workflow,
# once with target=dev and once with target=prod (prod waits for the environment approval).
# Delete this file once both targets are destroyed.
name: legacy supply_chain_lakehouse destroy (one-time)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Bundle target to destroy
        type: choice
        options: [dev, prod]
        required: true
      confirm:
        description: Type DESTROY to confirm (drops the schema and all its data)
        type: string
        required: true

jobs:
  destroy:
    name: Destroy legacy bundle (${{ inputs.target }})
    if: ${{ inputs.confirm == 'DESTROY' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
    defaults:
      run:
        working-directory: supply_chain_lakehouse
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 973438d9179184bd73de0b4127984c9c4ad3c287
      - uses: databricks/setup-cli@main
      - name: Show what will be destroyed
        run: databricks bundle summary --target ${{ inputs.target }}
      - name: Destroy
        run: databricks bundle destroy --target ${{ inputs.target }} --auto-approve
