# CI for the cicd_dabs__data_eng__supply_chain bundle: triggered on every pull request to main.
# No trigger-level path filter on purpose: the protect-main ruleset requires these checks on
# every PR, so they must report even when a PR only touches other files. Instead, a `changes`
# job detects whether this bundle (or this workflow) changed; if not, the checks below are
# skipped, and GitHub treats skipped required checks as passing.
#   0. Detect changes (dorny/paths-filter)
#   1. Unit tests (pytest, no Databricks needed)
#   2. Bundle validation against the dev workspace with the dev service principal
# workflow_dispatch always runs the full checks. 
name: cicd_dabs__data_eng__supply_chain CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: cicd_dabs__data_eng__supply_chain

concurrency:
  group: supply-chain-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      supply_chain: ${{ steps.filter.outputs.supply_chain }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            supply_chain:
              - 'cicd_dabs__data_eng__supply_chain/**'
              - '.github/workflows/cicd_dabs__data_eng__supply_chain_*.yml'

  unit-tests:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.supply_chain == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest -v

  validate-bundle:
    name: Validate bundle (dev)
    needs: [changes, unit-tests]
    if: needs.changes.outputs.supply_chain == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks current-user me
      - run: databricks bundle validate --strict --target dev
